<style>
/* 布局：上方状态栏 → 像素场景窗 → 功能匾额 → 羊皮纸面板；弹窗为宫廷诏书框。整套为固定的“夜宫”单一视觉。 */
:root{
  --bg:#1e0b0e; --bg2:#33121a; --wall:#7a1a1e; --red:#a3262a; --red2:#c8373b;
  --gold:#e8b84a; --gold2:#a87a26; --paper:#f1e2bf; --paper2:#dcc596; --paperhi:#fff6dc;
  --ink:#2a1712; --ink2:#6b4a33; --jade:#4f9078; --jade2:#2f6455; --pink:#e88aa4; --mut:#8e6f57;
  --f-ui:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--paper);font-family:var(--f-ui);font-size:15px;line-height:1.6;
  background-image:radial-gradient(var(--bg2) 1px,transparent 1px);background-size:6px 6px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
#app{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
img.px,canvas{image-rendering:pixelated;image-rendering:crisp-edges}
button{font-family:inherit}
/* 顶栏 */
#top{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;background:var(--wall);border:3px solid var(--ink);
  box-shadow:inset 0 0 0 2px var(--gold2),4px 4px 0 #0008;padding:8px 12px;color:var(--paper)}
#top .date{font-weight:700;color:var(--gold);letter-spacing:1px}
#top .st{display:flex;gap:4px;align-items:center;font-variant-numeric:tabular-nums;white-space:nowrap}
#top .st b{color:var(--gold);font-weight:600}
#top .sp{flex:1}
.pip{display:inline-block;width:9px;height:9px;background:var(--gold);box-shadow:0 0 0 1px var(--ink);margin-right:2px}
.pip.off{background:#4a1c1f}
/* 场景 */
#stage{position:relative;border:3px solid var(--ink);box-shadow:inset 0 0 0 2px var(--gold2),4px 4px 0 #0008;background:#000;line-height:0}
#scene{width:100%;aspect-ratio:192/80;display:block}
#loc{position:absolute;left:8px;top:8px;line-height:1}
#snd{position:absolute;right:8px;top:8px;line-height:1.2}
/* 菜单 */
#menu{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.btn{cursor:pointer;background:var(--red);color:var(--paperhi);border:3px solid var(--ink);padding:7px 8px;font-size:14px;
  box-shadow:inset -3px -3px 0 var(--wall),inset 3px 3px 0 var(--red2),3px 3px 0 #0007;letter-spacing:1px;line-height:1.3}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translate(2px,2px);box-shadow:inset -3px -3px 0 var(--wall),inset 3px 3px 0 var(--red2),1px 1px 0 #0007}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.btn.on{background:var(--gold2);color:var(--ink);box-shadow:inset -3px -3px 0 #7a5418,inset 3px 3px 0 var(--gold),3px 3px 0 #0007}
.btn.jade{background:var(--jade);box-shadow:inset -3px -3px 0 var(--jade2),inset 3px 3px 0 #6fb79b,3px 3px 0 #0007}
.btn.gold{background:var(--gold);color:var(--ink);box-shadow:inset -3px -3px 0 var(--gold2),inset 3px 3px 0 #ffe08a,3px 3px 0 #0007}
.btn.sm{padding:4px 8px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:grayscale(.6)}
.btn small{display:block;font-size:11px;opacity:.85;letter-spacing:0}
/* 面板 */
.pix{background:var(--paper);color:var(--ink);border:4px solid var(--ink);
  box-shadow:inset -4px -4px 0 var(--paper2),inset 4px 4px 0 var(--paperhi),4px 4px 0 #0009}
#panel{padding:16px 18px;min-height:240px}
#panel h2{margin:0 0 10px;font-size:20px;color:var(--wall);letter-spacing:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#panel h2::before{content:"";width:10px;height:10px;background:var(--red);box-shadow:0 0 0 2px var(--ink)}
#panel h3{margin:16px 0 8px;font-size:16px;color:var(--ink2);letter-spacing:2px;border-bottom:2px dashed var(--paper2);padding-bottom:4px}
.hint{color:var(--ink2);font-size:13px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.grow{flex:1;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card{background:var(--paperhi);border:3px solid var(--ink);padding:8px;display:flex;gap:8px;cursor:pointer;box-shadow:3px 3px 0 var(--paper2);text-align:left;color:var(--ink);font-size:13px;line-height:1.5}
.card:hover{background:#fffbea;transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--paper2)}
.card:focus-visible{outline:3px solid var(--red)}
.card .nm{font-weight:700;font-size:15px;color:var(--wall)}
.por{background:linear-gradient(#e9d3a8,#d8bc86);border:3px solid var(--ink);flex:none;display:block}
.por.cold{filter:grayscale(.85) brightness(.9)}
.tag{display:inline-block;font-size:11px;padding:0 5px;border:2px solid var(--ink);margin-right:3px;line-height:1.5;background:var(--paper)}
.tag.r{background:var(--red);color:var(--paperhi)}.tag.g{background:var(--jade);color:#fff}.tag.y{background:var(--gold)}.tag.k{background:#555;color:#eee}
.bar{display:flex;align-items:center;gap:6px;font-size:12px;font-variant-numeric:tabular-nums}
.bar i{flex:1;height:8px;background:#cdb88c;border:2px solid var(--ink);position:relative;min-width:50px}
.bar i b{position:absolute;left:0;top:0;bottom:0;background:var(--red)}
.bar span{width:3.2em}.bar em{width:2.2em;text-align:right;font-style:normal}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 14px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.story{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto}
.story li{background:var(--paperhi);border-left:4px solid var(--red);padding:5px 10px;font-size:14px}
.story li.big{border-left-color:var(--gold2);background:#fff3cf}
.story li time{display:block;font-size:11px;color:var(--mut)}
.inp{font:inherit;padding:6px 8px;border:3px solid var(--ink);background:var(--paperhi);color:var(--ink);width:100%;max-width:260px}
.inp:focus{outline:3px solid var(--gold)}
label.opt{display:flex;gap:8px;align-items:flex-start;background:var(--paperhi);border:3px solid var(--ink);padding:8px;cursor:pointer}
label.opt:has(input:checked){background:#ffe9b0;box-shadow:inset 0 0 0 2px var(--gold2)}
.form{display:grid;gap:10px;max-width:640px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* 绿头牌 */
.pais{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:6px 0}
.pai{writing-mode:vertical-rl;width:52px;height:150px;background:linear-gradient(#6aa98a,#3f7d66);border:3px solid var(--ink);
  border-radius:22px 22px 0 0;color:#fff7d6;font-size:15px;letter-spacing:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:inset -3px -3px 0 #2a5a49,inset 3px 3px 0 #8fd0b0,3px 3px 0 #0006;padding:6px 0;font-family:inherit}
.pai:hover{transform:translateY(-6px)}
.pai[disabled]{background:linear-gradient(#999,#777);cursor:not-allowed;transform:none}
.pai small{font-size:11px;letter-spacing:1px;opacity:.85}
/* 弹窗 */
#modal{position:fixed;inset:0;background:#0b0306c8;display:flex;align-items:center;justify-content:center;z-index:50;
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
#mbox{width:100%;max-width:600px;max-height:100%;overflow:auto;padding:14px 18px 16px}
.mtitle{text-align:center;margin:-2px 0 10px;line-height:0}
.mbody{display:flex;gap:14px;align-items:flex-start}
.mpor{flex:none;text-align:center;font-size:12px;color:var(--ink2)}
.mtext{flex:1;min-width:0;font-size:15px;line-height:1.85}
.mtext p{margin:0 0 8px}
.mtext .fx{color:var(--wall);font-weight:600;font-size:13px}
.mch{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.mch .btn{text-align:left}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:var(--ink);color:var(--gold);border:2px solid var(--gold2);padding:5px 14px;font-size:14px;animation:tin .25s steps(3)}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
#mapwrap{position:relative;line-height:0}
#mapc{width:100%;aspect-ratio:200/128;display:block;cursor:pointer;border:3px solid var(--ink);image-rendering:pixelated}
.mlab{position:absolute;transform:translate(-50%,-50%);font:11px/1.35 var(--f-ui);padding:0 3px;background:#2a1712cc;color:#ffe08a;border:1px solid var(--gold2);cursor:pointer;white-space:nowrap}
.mlab:hover,.mlab:focus-visible{background:var(--wall);outline:none}
@media (max-width:480px){.mlab{font-size:9px;padding:0 1px}}
textarea.inp{max-width:100%;min-height:70px;font-size:12px;word-break:break-all}
.title-wrap{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 0}
.log-filter{display:flex;gap:6px;margin-bottom:8px}
@media (max-width:760px){
  #menu{grid-template-columns:repeat(5,1fr)}
  .mbody{flex-direction:column;align-items:center}
  .form .two{grid-template-columns:1fr}
  #panel{padding:12px}
}
@media (max-width:420px){ #menu{grid-template-columns:repeat(3,1fr)} .btn{font-size:13px;padding:6px 4px} }
@media (prefers-reduced-motion:reduce){ .pai:hover,.card:hover{transform:none} #toast div{animation:none} }
</style>

const PT_CACHE=new Map();
function pixText(text,size,color,scale){
  const key=text+size+color+scale; if(PT_CACHE.has(key)) return PT_CACHE.get(key);
  const font=`700 ${size}px ${getComputedStyle(document.documentElement).getPropertyValue('--f-ui')}`;
  const c=document.createElement('canvas'),x=c.getContext('2d');x.font=font;
  const w=Math.ceil(x.measureText(text).width)+4,h=size+5;c.width=w;c.height=h;
  x.font=font;x.textBaseline='top';x.fillStyle='#fff';x.fillText(text,2,2);
  const d=x.getImageData(0,0,w,h),a=d.data,on=new Uint8Array(w*h);
  for(let i=0;i<w*h;i++) on[i]=a[i*4+3]>120?1:0;
  const o=x.createImageData(w,h),b=o.data;
  const put=(i,hex)=>{const n=parseInt(hex.slice(1),16);b[i*4]=n>>16;b[i*4+1]=n>>8&255;b[i*4+2]=n&255;b[i*4+3]=255};
  for(let y=0;y<h;y++)for(let X=0;X<w;X++){const i=y*w+X;
    if(on[i]) put(i,y<h*0.45?shade(color,.25):color);
    else if((X>0&&on[i-1])||(y>0&&on[i-w])||(X<w-1&&on[i+1])||(y<h-1&&on[i+w])) put(i,'#2a1712');
    else if(X>0&&y>0&&on[i-w-1]) put(i,'#00000088'.slice(0,7));}
  x.putImageData(o,0,0);
  const url=c.toDataURL(),html=`<img class="px" alt="${esc(text)}" src="${url}" width="${w*scale}" height="${h*scale}">`;
  PT_CACHE.set(key,html);return html;
}

A.endMonth=function(){
  if(!S||S.over||modalOpen)return;const e=E();
  // 财政
  const inc=rd(45+e.people*1.1),exp=alive().reduce((s,c)=>s+(c.cold?1:STIPEND[c.rank]),0)+kidsAlive().reduce((s,k)=>s+3+(k.tutor?5:0),0);

  for(const c of alive()){
    if(!c.cold){c.favor=clamp(c.favor-(c.bond?0:c.trait==='淡泊'?1:2));if(c.favor<25)c.mood=clamp(c.mood-3);else if(c.favor>60)c.mood=clamp(c.mood+1)}else c.mood=clamp(c.mood-3);
    if(c.preg>0){c.preg++;if(c.preg===2)pushEv(pregEvent(c));if(c.preg>=10)pushEv(birthEvent(c))}
  }
  kidsAlive().forEach(growKid);

  S.turn++;S.month++;let newYear=false;
  if(S.month>12){S.month=1;S.year++;e.age++;newYear=true;alive().forEach(c=>c.age++)}
  let dh=-.17-(e.age>40?(e.age-40)*.05:0)-Math.max(0,(e.nightsMonth||0)-3)*1.2-(e.style==='风流'?.05:0);
  e.health=clamp(e.health+dh);e.nightsMonth=0;e.energy=maxEnergy();
  if(e.treasury<0){const d=Math.min(8,Math.ceil(-e.treasury/400));chg({people:-1-d,prestige:-1});log(`国库亏空${-e.treasury}万两，百官俸禄迟发，民间加征赋税。`)}
  if(S.cands.length){S.cands=[];log('选秀礼毕。')}
  toast(`${dateStr()}　岁入${inc}　支出${exp}`);
  // 岁末总结
  if(newYear){const y=S.ys;pushEv({title:'岁首',sfx:'chime',text:`爆竹声中一岁除。${dateStr()}，陛下${e.age}岁。\n去岁：新入宫${y.c}人，皇嗣降生${y.b}位，侍寝${y.n}次。\n国库${e.treasury}万两，威望${rd(e.prestige)}，民心${rd(e.people)}。`,choices:[{t:'新岁新气象'}]});S.ys={c:0,b:0,n:0}}
  // 事件
  if(S.month===2&&S.turn-S.flags.lastXX>=34) pushEv({title:'三年大选',sfx:'chime',text:'又到三年一度的大选之期，各地秀女已候于储秀宫。',choices:[{t:'前去看看',f:()=>{genCands();UI.view='xx';return null}},{t:'今年免了',f:()=>{S.flags.lastXX=S.turn;return fx(chg({people:2}))}}]});
  const fest=chance(.7)?festival():null;if(fest)pushEv(fest);
  relTick();const arcEv=arcTick();if(arcEv)pushEv(arcEv);
  if(chance(arcEv?.3:.55))pushEv(haremEvent());
  pushEv(heirTick());
  if(chance(.22))pushEv(courtEvent(true));
  if(chance(.28))pushEv(kidEvent());
  pushEv(milestone());
  if(chance(.12))pushEv(dowagerEvent());
  log(`—— ${dateStr()} ——`);
  setScene(pick(['court','harem','garden']));
  save('auto');
  render();if(!modalOpen)checkEnd();
};
function checkEnd(){

function deathEvent(why){
  S.over=true;const e=E();const yrs=S.year;
  const score=e.prestige*.5+e.people*.5;
  const shi=score>=80?'圣':score>=68?'文':score>=56?'景':score>=44?'恭':score>=32?'哀':'炀';
  const miao=['太祖','太宗','高宗','仁宗','宣宗','英宗','宪宗','孝宗','穆宗','神宗'][S.gen-1]||'睿宗';
  const sons=kidsAlive().filter(k=>k.sex==='m'&&!k.jailed);let heir=S.heir&&kidById(S.heir);if(!heir||!heir.alive)heir=sons.sort((a,b)=>a.born-b.born)[0];
  const nC=S.consorts.length,nK=S.children.length;
  let t= why==='民变'?`流民四起，叛军攻破京城。${e.era}${cnNum(yrs)}年，${e.sur}${e.name}自缢于宫中，享年${e.age}岁。`
    :`${dateStr()}，${e.sur}${e.name}崩于养心殿，享年${e.age}岁，在位${yrs}年。`;
  t+=`\n庙号${miao}，谥曰「${shi}皇帝」。\n一生册封后妃${nC}人，育皇子${S.children.filter(k=>k.sex==='m').length}人、公主${S.children.filter(k=>k.sex==='f').length}人。`;

  return {title:why==='民变'?'国破':'龙驭宾天',por:'emp',text:t,choices:ch};
}

const rk=(a,b)=>a.id<b.id?a.id+'_'+b.id:b.id+'_'+a.id;
function relGet(a,b){if(!a||!b||a===b||!S.rel)return 0;return S.rel[rk(a,b)]||0}
function relAdd(a,b,v){if(!a||!b||a===b)return;S.rel=S.rel||{};const k=rk(a,b);S.rel[k]=clamp((S.rel[k]||0)+v,-100,100)}

function leaders(){const h=harem(),L=[],em=empress();if(em)L.push(em);
  const others=h.filter(c=>c.rank>=5&&c.rank<8).sort((a,b)=>(b.rank*20+b.favor+b.scheme*.5)-(a.rank*20+a.favor+a.scheme*.5));
  for(const o of others){if(L.length>=2)break;L.push(o)}
  return L}
function factions(){const L=leaders(),map={},neutral=[];L.forEach(l=>map[l.id]=[]);
  harem().forEach(c=>{if(L.includes(c))return;let best=null,bv=8;
    L.forEach(l=>{const v=relGet(c,l)+(l.rank===8&&c.virtue>60?6:0)+(l.scheme>60&&c.scheme>60?6:0);if(v>bv){bv=v;best=l}});
    if(best)map[best.id].push(c);else neutral.push(c)});
  return {L,map,neutral}}
function facOf(c){const f=factions();for(const l of f.L){if(l===c||f.map[l.id].includes(c))return l}return null}
function allyBonus(v){if(!v)return 0;return Math.min(.25,harem().filter(o=>o!==v&&relGet(o,v)>=40).length*.08)}
function relTick(){const h=harem(),f=factions(),fid={};
  f.L.forEach(l=>{fid[l.id]=l.id;f.map[l.id].forEach(m=>fid[m.id]=l.id)});
  for(let i=0;i<h.length;i++)for(let j=i+1;j<h.length;j++){const a=h[i],b=h[j];let d=0;
    if(fid[a.id]&&fid[a.id]===fid[b.id])d+=1.5;else if(fid[a.id]&&fid[b.id])d-=1.2;
    if(TRAITS[a.trait].jealous&&b.favor>a.favor+15)d-=2;if(TRAITS[b.trait].jealous&&a.favor>b.favor+15)d-=2;

 function clash(){const f=factions();if(f.L.length<2)return null;const [a,b]=f.L,ma=f.map[a.id],mb=f.map[b.id];if(!ma.length&&!mb.length)return null;

[[['景仁宫','承乾宫','钟粹宫','延禧宫','永和宫','景阳宫'],[124,158]],[['永寿宫','翊坤宫','储秀宫','启祥宫','长春宫','咸福宫'],[14,48]]].forEach(([names,xs])=>names.forEach((n,i)=>{const x=xs[i%2],y=[50,68,86][Math.floor(i/2)];PLACES.push({id:'p'+n,n,r:[x,y,26,12],d:[x+13,y+14],k:'palace',p:n,sc:'harem'})}));
const emp={x:100,y:82,path:[],arrive:null,trail:[]};
const NPC=new Map();let hoverP=null,mapParts=[];
function nearestH(y){return HY.reduce((a,b)=>Math.abs(b-y)<Math.abs(a-y)?b:a)}
function planPath(sx,sy,tx,ty){const pts=[];let x=sx,y=sy;
  if(!HY.includes(y)){const ny=(x===100&&(y<46||y>100))?(y<46?46:100):nearestH(y);pts.push([x,ny]);y=ny}
  if(!HY.includes(ty)){const ny=ty<46?46:100;if(y!==ny){const sv=Math.abs(x-44)<Math.abs(x-154)?44:154;pts.push([sv,y],[sv,ny]);y=ny}pts.push([100,y],[100,ty]);return pts}
  if(ty===y){pts.push([tx,ty]);return pts}
  const vx=[44,154].sort((a,b)=>(Math.abs(x-a)+Math.abs(a-tx))-(Math.abs(x-b)+Math.abs(b-tx)))[0];
  pts.push([vx,y],[vx,ty],[tx,ty]);return pts}
function stepTo(n,sp){const [tx,ty]=n.path[0],dx=tx-n.x,dy=ty-n.y,d=Math.hypot(dx,dy);if(d<=sp){n.x=tx;n.y=ty;n.path.shift();return !n.path.length}n.x+=dx/d*sp;n.y+=dy/d*sp;return false}
function npcHome(c){const pl=PLACES.find(p=>p.k==='palace'&&p.p===c.palace);return pl?pl.d:[100,64]}
function npcSync(){const ids=new Set();alive().forEach(c=>{ids.add(c.id);if(!NPC.has(c.id)){const h=c.cold?[23,46]:npcHome(c);NPC.set(c.id,{x:h[0],y:h[1],path:[],wait:ri(5,60),ox:ri(-3,3),where:'home'})}});[...NPC.keys()].forEach(id=>{if(!ids.has(id))NPC.delete(id)})}
function npcStep(){npcSync();for(const [id,n] of NPC){const c=byId(id);if(!c)continue;
  if(c.cold){n.x=23;n.y=46;n.path=[];n.where='cold';continue}
  if(n.path.length){stepTo(n,1.2);continue}
  if(n.wait>0){n.wait--;continue}
  const home=npcHome(c),r=R();let dest,where;
  if(c.preg>=2||r<.45){dest=home;where='home'}else if(r<.75){dest=[100,46];where='garden'}
  else if(r<.88){const al=harem().filter(o=>o!==c&&relGet(c,o)>=30);dest=al.length?npcHome(pick(al)):home;where=al.length?'visit':'home'}else{dest=[100,64];where='kn'}
  n.path=planPath(Math.round(n.x),Math.round(n.y),dest[0],dest[1]);if(where==='garden')n.path.push([ri(64,136),ri(16,38)]);
  n.where=where;n.wait=ri(60,220)}}
function goPlace(p){AU.sfx('click');if(Math.round(emp.x)===p.d[0]&&Math.round(emp.y)===p.d[1]&&!emp.path.length){arrive(p);return}
  emp.path=planPath(Math.round(emp.x),Math.round(emp.y),p.d[0],p.d[1]);emp.arrive=()=>arrive(p)}
function arrive(p){S.pos={x:p.d[0],y:p.d[1]};setScene(p.sc);AU.sfx('page');
  if(p.k==='view')UI.view=p.v;else if(p.k==='palace'){UI.view='palace';UI.sel=p.p}else{UI.view='place';UI.sel=p.id}
  render()}
function nearestPlace(){const p=PLACES.find(p=>S.pos&&p.d[0]===S.pos.x&&p.d[1]===S.pos.y);return p?p.n+'门前':'宫道上'}
function mapTick(){if(!S||UI.view!=='map'||modalOpen)return;
  if(emp.path.length){const done=stepTo(emp,3.5);emp.trail.push([emp.x,emp.y]);if(emp.trail.length>5)emp.trail.shift();
    if(done){S.pos={x:Math.round(emp.x),y:Math.round(emp.y)};if(emp.arrive){const f=emp.arrive;emp.arrive=null;f()}}}
  npcStep();drawMap()}
function M(x,y,w,h,c){mg.fillStyle=c;mg.fillRect(Math.round(x),Math.round(y),w,h)}
function drawMap(){const s=season();
  M(0,0,MW,MH,'#7a1a1e');M(1,1,MW-2,1,'#a3262a');M(3,3,MW-6,MH-6,s===3?'#e4e0d8':'#cbbd9f');
  for(let y=5;y<MH-4;y+=4)for(let x=5+((y>>2)%2)*4;x<MW-4;x+=8)M(x,y,1,1,s===3?'#d4d0c8':'#bcae8f');
  const RC=s===3?'#f6f4f0':'#e9dfca',RE=s===3?'#d9d4cb':'#cdbf9f';
  HY.forEach(y=>{M(10,y-2,180,5,RC);M(10,y+3,180,1,RE)});[44,154].forEach(x=>M(x-2,46,5,56,RC));M(98,6,5,42,RC);M(98,98,5,22,RC);
  // 御花园
  const G=[58,12,84,30];M(G[0],G[1],G[2],G[3],['#8bbd6e','#5f9e4f','#b39a4c','#d9e2dc'][s]);M(G[0],G[1],G[2],1,'#a3262a');
  for(let y=-5;y<=5;y++)for(let x=-13;x<=13;x++)if((x/13)**2+(y/5)**2<=1)M(76+x,28+y,1,1,(x+y+frame)%7?'#4a8fb0':'#7fb9d4');
  M(116,18,10,7,'#ece7db');M(117,16,8,5,'#3f8a7a');M(118,15,6,1,'#2c6b5e');M(120,14,2,1,GOLD);
  const tc=[['#f4a6c0','#e27aa0'],['#3f8a44','#2f6e36'],['#e08a3a','#c0602a'],['#f4f6f8','#c8d0d6']][s];
  [[64,16],[70,38],[92,16],[132,30],[136,16],[110,38],[62,26],[126,38]].forEach(([x,y],i)=>{M(x,y+2,1,2,'#5a3a22');M(x-1,y,3,2,tc[i%2]);M(x,y-1,1,1,tc[(i+1)%2])});
  M(104,30,4,3,'#8f8f8f');M(105,29,2,1,'#a8a8a8');
  // 建筑
  PLACES.forEach(p=>{if(p.id==='yh')return;const [x,y,w,h]=p.r;
    if(p.id==='sw'||p.id==='wm'){M(x,y,w,h,'#a3262a');M(x+1,y+1,w-2,2,YROOF[0]);M(x+1,y+2,w-2,1,YROOF[1]);M(x+w/2-2,y+h-2,4,2,'#3a2a20');}
    else{const cold=p.id==='lg',roof=cold?['#7d7d84','#5c5c63','#47474d']:p.id==='wy'?GROOF:YROOF;
      M(x,y,w,h,cold?'#6d6a66':'#a3262a');M(x+1,y+1,w-2,h-2,s===3?'#eeeae4':'#dacdb2');
      const rx=x+3,ry=y+2,rw=w-6,rh=Math.max(4,h-5);M(rx,ry,rw,rh,roof[0]);for(let i=rx+1;i<rx+rw;i+=2)M(i,ry,1,rh,roof[1]);M(rx,ry+(rh>>1),rw,1,roof[2]);M(rx,ry+rh-1,rw,1,roof[1]);
      M(rx,ry,1,1,roof[2]);M(rx+rw-1,ry,1,1,roof[2]);
      if(s===3)M(rx,ry,rw,rh>>1,'#f2f5f8');
      const top=p.d[1]<y;M(p.d[0]-2,top?y:y+h-1,4,1,'#3a2a20');
      if(p.k==='palace'&&p.p!=='冷宫'&&harem().some(c=>c.palace===p.p&&c.preg>=2)){M(x+w-4,y+1,2,2,'#f08aa8')}
      if(S.cands&&S.cands.length&&p.p==='储秀宫'){M(x+1,y+1,2,2,GOLD)}}
    if(hoverP===p){mg.strokeStyle='#ffd86b';mg.lineWidth=1;mg.strokeRect(x-.5,y-.5,w+1,h+1)}});
  // 妃嫔
  for(const [id,n] of NPC){const c=byId(id);if(!c)continue;const x=Math.round(n.x+n.ox),y=Math.round(n.y);
    if(n.where==='home'&&!n.path.length&&n.wait>0&&(frame+id)%40<28)continue;
    M(x-1,y-6,3,2,'#1d1520');M(x-1,y-4,3,1,'#f2cfb2');M(x-1,y-3,3,3,c.cold?'#8a8a8a':ROBES[c.rank]);M(x-1,y,1,1,INK);M(x+1,y,1,1,INK);
    if(c.preg>=2)M(x,y-8,1,1,'#f08aa8');if(c.rank>=5)M(x+1,y-7,1,1,GOLD)}
  // 皇帝与太监
  const tr=emp.trail[0]||[emp.x,emp.y];const ax=Math.round(tr[0])-4,ay=Math.round(tr[1]);
  M(ax-1,ay-5,3,1,'#33363c');M(ax-1,ay-4,3,1,'#f2cfb2');M(ax-1,ay-3,3,3,'#5b6b85');M(ax-2,ay-8,5,1,'#c0392b');M(ax,ay-7,1,3,'#5a3a22');
  const ex=Math.round(emp.x),ey=Math.round(emp.y),bob=emp.path.length&&frame%2?1:0;
  M(ex-2,ey-7-bob,5,1,'#1b1b24');M(ex-1,ey-8-bob,3,1,'#1b1b24');M(ex-1,ey-6-bob,3,1,'#f2cfb2');M(ex-1,ey-5-bob,3,4,'#e8b52c');M(ex,ey-4-bob,1,1,'#c0392b');M(ex-1,ey-1,1,1,INK);M(ex+1,ey-1,1,1,INK);
  // 四季
  const want=[18,0,14,30][s];if(mapParts.length<want&&chance(.5))mapParts.push({x:R()*MW,y:-2,vx:s===3?.1:.4,vy:s===3?.35:.3,t:R()*6,c:s===0?'#f7b6c8':s===2?pick(['#e0893a','#c9562a']):'#ffffff'});
  mapParts.forEach(p=>{p.t+=.2;p.x+=p.vx+Math.sin(p.t)*.3;p.y+=p.vy;M(p.x,p.y,1,1,p.c)});mapParts=mapParts.filter(p=>p.y<MH&&p.x<MW);
}
function meetConsort(c){if(!c||!c.alive||c.gone)return;setScene('harem');
  const t=pick(['正带着宫女往御花园去','刚从坤宁宫请安出来','抱着一卷书匆匆走过','停下脚步，盈盈一拜','站在宫墙下看一树新开的花','提着一盒点心，说正要去看望姐妹']);
  pushEv({title:'宫道偶遇',por:c,text:`你在宫道上遇见了${cName(c)}，她${t}。`,choices:[
    {t:'闲话家常（精力-1）',cond:()=>E().energy>0,why:'精力不足',f:()=>{A.chat(c.id);return null}},
    {t:'今夜召她侍寝（精力-1）',cond:()=>E().energy>0&&!c.preg,why:c.preg?'她有孕在身':'精力不足',f:()=>{nightWith(c);return null}},
    {t:'赏她一支簪子（国库-10万两）',f:()=>fx(chg({treasury:-10}),cchg(c,{mood:10,aff:3}))},
    {t:'点头作别'}]})}
MAPC.addEventListener('click',e=>{if(!S)return;const r=MAPC.getBoundingClientRect(),mx=(e.clientX-r.left)/r.width*MW,my=(e.clientY-r.top)/r.height*MH;
  let best=null,bd=6;for(const [id,n] of NPC){const d=Math.hypot(n.x+n.ox-mx,n.y-3-my);if(d<bd){bd=d;best=[id,n]}}
  if(best){const c=byId(best[0]),n=best[1];if(!c)return;n.path=[];n.wait=400;let tx=Math.round(n.x),ty=Math.round(n.y);
    if(!HY.includes(ty)){if(ty<46){tx=100;ty=46}else ty=nearestH(ty)}
    AU.sfx('click');emp.path=planPath(Math.round(emp.x),Math.round(emp.y),tx,ty);
    emp.arrive=()=>{n.wait=ri(30,80);if(c.cold){UI.view='palace';UI.sel='冷宫';setScene('night');render();return}meetConsort(c)};
    if(!emp.path.length)emp.arrive();return}
  const p=PLACES.find(p=>mx>=p.r[0]&&mx<=p.r[0]+p.r[2]&&my>=p.r[1]&&my<=p.r[1]+p.r[3]);if(p)goPlace(p)});
MAPC.addEventListener('mousemove',e=>{const r=MAPC.getBoundingClientRect(),mx=(e.clientX-r.left)/r.width*MW,my=(e.clientY-r.top)/r.height*MH;
  hoverP=PLACES.find(p=>mx>=p.r[0]&&mx<=p.r[0]+p.r[2]&&my>=p.r[1]&&my<=p.r[1]+p.r[3])||null});
MAPC.addEventListener('mouseleave',()=>{hoverP=null});
setInterval(mapTick,50);
function mountMap(){const w=$('#mapwrap');if(!w)return;w.appendChild(MAPC);
  PLACES.forEach(p=>{const b=document.createElement('button');b.className='mlab';b.textContent=p.n;const [x,y,ww,h]=p.r;
    b.style.left=((x+ww/2)/MW*100)+'%';b.style.top=((y+h/2)/MH*100)+'%';
    b.onclick=()=>goPlace(p);b.ondblclick=()=>{emp.path=[];emp.arrive=null;emp.x=p.d[0];emp.y=p.d[1];arrive(p)};
    b.onmouseenter=()=>{hoverP=p};b.onmouseleave=()=>{hoverP=null};w.appendChild(b)})}
const backBtn=`<button class="btn sm" onclick="A.go('map')">◂ 返回宫城</button>`;
function viewMap(){return `<h2>宫城<span class="hint" style="font-size:13px;letter-spacing:0">点宫殿前往，点路上的小人与她相遇；双击宫殿名直接抵达</span></h2><div id="mapwrap"></div><p class="hint">你在${esc(nearestPlace())}。粉点是有孕的妃嫔，金点是储秀宫正在选秀。</p>`}
function viewPalace(){const name=UI.sel,res=name==='冷宫'?alive().filter(c=>c.cold):harem().filter(c=>c.palace===name);
  const extra=name==='储秀宫'&&S.cands.length?`<div class="acts"><button class="btn gold" onclick="A.go('xx')">秀女正在候选（${S.cands.length}人）</button></div>`:'';
  return `<h2>${esc(name)}${backBtn}</h2><p class="hint">${name==='冷宫'?'荒草萋萋，宫门深锁。':name==='坤宁宫'?'中宫所居，凤仪万方。':'宫门半掩，廊下挂着鸟笼。'}</p>${extra}${res.length?`<div class="grid">${res.map(consortCard).join('')}</div>`:'<p class="hint">此处暂无人居住。</p>'}`}
function viewPlace(){const id=UI.sel;
  if(id==='cj')return `<h2>宸极殿${backBtn}</h2><p>文武百官已在丹墀下候着。</p><div class="acts"><button class="btn gold" onclick="A.court()">临朝听政<small>精力-1</small></button></div>`;
  if(id==='yh'){const here=[...NPC].filter(([i,n])=>n.where==='garden'&&!n.path.length).map(([i])=>byId(i)).filter(c=>c&&c.alive&&!c.cold);
    return `<h2>御花园${backBtn}</h2><p>${['桃花开得正好，蜂蝶纷飞。','荷风送香，蝉鸣阵阵。','丹桂飘香，满地金黄。','红梅映雪，暗香浮动。'][season()]}</p><div class="acts"><button class="btn" onclick="A.out('garden')">园中漫步<small>精力-1</small></button></div>${here.length?`<h3>园中的人</h3><div class="grid">${here.map(c=>`<button class="card" onclick="meetConsort(byId(${c.id}))">${porImg(c,48)}<div class="grow"><div class="nm">${esc(cName(c))}</div><div>正在园中${['赏花','喂鱼','扑蝶','散步'][c.id%4]}</div></div></button>`).join('')}</div>`:'<p class="hint">园中此刻没有旁人。</p>'}`}
  if(id==='cn'){const d=S.flags.dowager;return `<h2>慈宁宫${backBtn}</h2>${d&&d.alive?`<p>${esc(d.name)}正在佛堂诵经。</p><div class="acts"><button class="btn" onclick="A.greet()">请安<small>精力-1</small></button></div>`:'<p class="hint">慈宁宫已经空了，只有佛前的长明灯还亮着。</p>'}`}
  return viewMap()}
A.greet=function(){if(!useE())return;const ev=dowagerEvent();if(ev){pushEv(ev);return}
  pushEv({title:'请安',text:`${S.flags.dowager.name}${pick(['拉着你的手问长问短，叮嘱你夜里早些歇息。','说起你小时候爬树摔破了膝盖，笑出了眼泪。','让你尝了尝她亲手做的素点心。'])}${fx(chg({prestige:1,health:1}))}`,choices:[ok1]})};
A.exportSave=function(){try{const t=btoa(unescape(encodeURIComponent(JSON.stringify(S))));const ta=$('#savecode');ta.value=t;ta.focus();ta.select();
  if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('存档码已复制'),()=>toast('已选中，请手动复制'));else toast('已选中，请手动复制')}catch(e){toast('导出失败')}};
A.importSave=function(){try{const t=$('#savecode').value.trim();const s=JSON.parse(decodeURIComponent(escape(atob(t))));if(!s.emp)throw 0;S=s;Q.length=0;migrate();UI.view='map';toast('已导入存档');render()}catch(e){toast('存档码无效，请检查是否复制完整')}};
function migrate(){if(!S)return;S.rel=S.rel||{};S.pos=S.pos||{x:100,y:82};alive().forEach(c=>{if(!c.arc)assignArc(c)});S.children.forEach(k=>{if(k.sup===undefined)k.sup=0});
  NPC.clear();emp.x=S.pos.x;emp.y=S.pos.y;emp.path=[];emp.arrive=null;emp.trail=[]}

setScene('court');render();requestAnimationFrame(loop);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&modalOpen&&document.activeElement&&document.activeElement.id==='minput'){choose(0)}});
