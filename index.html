<meta charset="utf-8">
<title>宸宫纪</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 布局：上方状态栏 → 像素场景窗 → 功能匾额 → 羊皮纸面板；弹窗为宫廷诏书框。整套为固定的“夜宫”单一视觉。 */
:root{
  --bg:#1e0b0e; --bg2:#33121a; --wall:#7a1a1e; --red:#a3262a; --red2:#c8373b;
  --gold:#e8b84a; --gold2:#a87a26; --paper:#f1e2bf; --paper2:#dcc596; --paperhi:#fff6dc;
  --ink:#2a1712; --ink2:#6b4a33; --jade:#4f9078; --jade2:#2f6455; --pink:#e88aa4; --mut:#8e6f57;
  --f-ui:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--paper);font-family:var(--f-ui);font-size:15px;line-height:1.6;
  background-image:radial-gradient(var(--bg2) 1px,transparent 1px);background-size:6px 6px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
#app{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
img.px,canvas{image-rendering:pixelated;image-rendering:crisp-edges}
button{font-family:inherit}
/* 顶栏 */
#top{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;background:var(--wall);border:3px solid var(--ink);
  box-shadow:inset 0 0 0 2px var(--gold2),4px 4px 0 #0008;padding:8px 12px;color:var(--paper)}
#top .date{font-weight:700;color:var(--gold);letter-spacing:1px}
#top .st{display:flex;gap:4px;align-items:center;font-variant-numeric:tabular-nums;white-space:nowrap}
#top .st b{color:var(--gold);font-weight:600}
#top .sp{flex:1}
.pip{display:inline-block;width:9px;height:9px;background:var(--gold);box-shadow:0 0 0 1px var(--ink);margin-right:2px}
.pip.off{background:#4a1c1f}
/* 场景 */
#stage{position:relative;border:3px solid var(--ink);box-shadow:inset 0 0 0 2px var(--gold2),4px 4px 0 #0008;background:#000;line-height:0}
#scene{width:100%;aspect-ratio:192/80;display:block}
#loc{position:absolute;left:8px;top:8px;line-height:1}
#snd{position:absolute;right:8px;top:8px;line-height:1.2}
/* 菜单 */
#menu{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.btn{cursor:pointer;background:var(--red);color:var(--paperhi);border:3px solid var(--ink);padding:7px 8px;font-size:14px;
  box-shadow:inset -3px -3px 0 var(--wall),inset 3px 3px 0 var(--red2),3px 3px 0 #0007;letter-spacing:1px;line-height:1.3}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translate(2px,2px);box-shadow:inset -3px -3px 0 var(--wall),inset 3px 3px 0 var(--red2),1px 1px 0 #0007}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.btn.on{background:var(--gold2);color:var(--ink);box-shadow:inset -3px -3px 0 #7a5418,inset 3px 3px 0 var(--gold),3px 3px 0 #0007}
.btn.jade{background:var(--jade);box-shadow:inset -3px -3px 0 var(--jade2),inset 3px 3px 0 #6fb79b,3px 3px 0 #0007}
.btn.gold{background:var(--gold);color:var(--ink);box-shadow:inset -3px -3px 0 var(--gold2),inset 3px 3px 0 #ffe08a,3px 3px 0 #0007}
.btn.sm{padding:4px 8px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:grayscale(.6)}
.btn small{display:block;font-size:11px;opacity:.85;letter-spacing:0}
/* 面板 */
.pix{background:var(--paper);color:var(--ink);border:4px solid var(--ink);
  box-shadow:inset -4px -4px 0 var(--paper2),inset 4px 4px 0 var(--paperhi),4px 4px 0 #0009}
#panel{padding:16px 18px;min-height:240px}
#panel h2{margin:0 0 10px;font-size:20px;color:var(--wall);letter-spacing:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#panel h2::before{content:"";width:10px;height:10px;background:var(--red);box-shadow:0 0 0 2px var(--ink)}
#panel h3{margin:16px 0 8px;font-size:16px;color:var(--ink2);letter-spacing:2px;border-bottom:2px dashed var(--paper2);padding-bottom:4px}
.hint{color:var(--ink2);font-size:13px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.grow{flex:1;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card{background:var(--paperhi);border:3px solid var(--ink);padding:8px;display:flex;gap:8px;cursor:pointer;box-shadow:3px 3px 0 var(--paper2);text-align:left;color:var(--ink);font-size:13px;line-height:1.5}
.card:hover{background:#fffbea;transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--paper2)}
.card:focus-visible{outline:3px solid var(--red)}
.card .nm{font-weight:700;font-size:15px;color:var(--wall)}
.por{background:linear-gradient(#e9d3a8,#d8bc86);border:3px solid var(--ink);flex:none;display:block}
.por.cold{filter:grayscale(.85) brightness(.9)}
.tag{display:inline-block;font-size:11px;padding:0 5px;border:2px solid var(--ink);margin-right:3px;line-height:1.5;background:var(--paper)}
.tag.r{background:var(--red);color:var(--paperhi)}.tag.g{background:var(--jade);color:#fff}.tag.y{background:var(--gold)}.tag.k{background:#555;color:#eee}
.bar{display:flex;align-items:center;gap:6px;font-size:12px;font-variant-numeric:tabular-nums}
.bar i{flex:1;height:8px;background:#cdb88c;border:2px solid var(--ink);position:relative;min-width:50px}
.bar i b{position:absolute;left:0;top:0;bottom:0;background:var(--red)}
.bar span{width:3.2em}.bar em{width:2.2em;text-align:right;font-style:normal}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 14px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.story{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto}
.story li{background:var(--paperhi);border-left:4px solid var(--red);padding:5px 10px;font-size:14px}
.story li.big{border-left-color:var(--gold2);background:#fff3cf}
.story li time{display:block;font-size:11px;color:var(--mut)}
.inp{font:inherit;padding:6px 8px;border:3px solid var(--ink);background:var(--paperhi);color:var(--ink);width:100%;max-width:260px}
.inp:focus{outline:3px solid var(--gold)}
label.opt{display:flex;gap:8px;align-items:flex-start;background:var(--paperhi);border:3px solid var(--ink);padding:8px;cursor:pointer}
label.opt:has(input:checked){background:#ffe9b0;box-shadow:inset 0 0 0 2px var(--gold2)}
.form{display:grid;gap:10px;max-width:640px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* 绿头牌 */
.pais{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:6px 0}
.pai{writing-mode:vertical-rl;width:52px;height:150px;background:linear-gradient(#6aa98a,#3f7d66);border:3px solid var(--ink);
  border-radius:22px 22px 0 0;color:#fff7d6;font-size:15px;letter-spacing:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:inset -3px -3px 0 #2a5a49,inset 3px 3px 0 #8fd0b0,3px 3px 0 #0006;padding:6px 0;font-family:inherit}
.pai:hover{transform:translateY(-6px)}
.pai[disabled]{background:linear-gradient(#999,#777);cursor:not-allowed;transform:none}
.pai small{font-size:11px;letter-spacing:1px;opacity:.85}
/* 弹窗 */
#modal{position:fixed;inset:0;background:#0b0306c8;display:flex;align-items:center;justify-content:center;z-index:50;
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
#mbox{width:100%;max-width:600px;max-height:100%;overflow:auto;padding:14px 18px 16px}
.mtitle{text-align:center;margin:-2px 0 10px;line-height:0}
.mbody{display:flex;gap:14px;align-items:flex-start}
.mpor{flex:none;text-align:center;font-size:12px;color:var(--ink2)}
.mtext{flex:1;min-width:0;font-size:15px;line-height:1.85}
.mtext p{margin:0 0 8px}
.mtext .fx{color:var(--wall);font-weight:600;font-size:13px}
.mtext .ref{font-size:12px;color:var(--mut);border-top:1px dashed var(--paper2);padding-top:4px;margin-top:6px}
.mch{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.mch .btn{text-align:left}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:var(--ink);color:var(--gold);border:2px solid var(--gold2);padding:5px 14px;font-size:14px;animation:tin .25s steps(3)}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
#mapwrap{position:relative;line-height:0}
#mapc{width:100%;aspect-ratio:200/128;display:block;cursor:pointer;border:3px solid var(--ink);image-rendering:pixelated}
.mlab{position:absolute;transform:translate(-50%,-50%);font:11px/1.35 var(--f-ui);padding:0 3px;background:#2a1712cc;color:#ffe08a;border:1px solid var(--gold2);cursor:pointer;white-space:nowrap}
.mlab:hover,.mlab:focus-visible{background:var(--wall);outline:none}
@media (max-width:480px){.mlab{font-size:9px;padding:0 1px}}
textarea.inp{max-width:100%;min-height:70px;font-size:12px;word-break:break-all}
.title-wrap{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 0}
.log-filter{display:flex;gap:6px;margin-bottom:8px}
@media (max-width:760px){
  #menu{grid-template-columns:repeat(5,1fr)}
  .mbody{flex-direction:column;align-items:center}
  .form .two{grid-template-columns:1fr}
  #panel{padding:12px}
}
@media (max-width:420px){ #menu{grid-template-columns:repeat(3,1fr)} .btn{font-size:13px;padding:6px 4px} }
@media (prefers-reduced-motion:reduce){ .pai:hover,.card:hover{transform:none} #toast div{animation:none} }

/* Contemporary palace UI: quiet surfaces, clear hierarchy, pixel artwork retained. */

.btn:hover{filter:brightness(1.06);box-shadow:0 4px 12px #192e2414}.btn:active{transform:translateY(1px);box-shadow:none}
.btn.on,.btn.gold{background:var(--gold);color:#332a1e;box-shadow:none}.btn.jade{background:var(--jade);box-shadow:none}.btn.sm{padding:7px 10px;min-height:34px}
#menu .btn{background:transparent;color:#d9e2d9;padding:10px 4px;box-shadow:none}

#panel h3{border-bottom:1px solid var(--paper2);padding-bottom:10px;margin-top:24px;letter-spacing:1px}.hint{line-height:1.85}
.grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:14px}
.card{border:1px solid var(--paper2);border-radius:12px;padding:14px;gap:12px;box-shadow:none;transition:transform .15s,box-shadow .15s;overflow-wrap:anywhere}
.card:hover{background:#fffefa;transform:translateY(-2px);box-shadow:0 8px 20px #2c3e3010;border-color:#c0b39b}.card .nm{font-size:16px;margin-bottom:4px}
.por{border:1px solid #d9cfba;border-radius:9px;background:linear-gradient(#eee7d5,#dcd6bd)}

@media(max-width:760px){body{padding-top:12px}#app{gap:12px}#top{padding:12px;gap:8px 14px}#panel{padding:20px}#scene{max-height:220px}#menu{grid-template-columns:repeat(5,minmax(0,1fr))}.btn{letter-spacing:0}#mbox{padding:20px}.mlab{padding:2px 3px}}

/* Command bar and workspace layout */
:root{--paper:#fcfaf5;--paperhi:#fffdf8;--paper2:#e6ddd0;--ink:#262823;--ink2:#5e6257;--wall:#742e2c;--red:#863a34;--gold:#e8ce9b}
body{background:linear-gradient(155deg,#f6f2e9,#e7dece) fixed;color:var(--ink)}

.brand{display:flex;align-items:center;gap:9px;font-weight:700;white-space:nowrap}
.brand::before{content:"宸";display:grid;place-items:center;width:29px;height:29px;border-radius:7px;background:#9a483e;color:#fff2dc;font-family:"Songti SC",serif}
#top .date{letter-spacing:0;font-size:14px}

#stage{box-shadow:none;border-radius:12px}
#loc{display:none}
#snd{top:auto;bottom:8px;right:8px;background:#232a26ed;color:#fff6e7}
#menu{background:var(--paper);border:1px solid var(--paper2);border-radius:12px}

#panel{border-radius:12px;box-shadow:none;min-width:0}

.title-wrap .save-list .btn{background:#eee6d9;color:var(--ink);text-align:left;white-space:normal;overflow-wrap:anywhere}

<script>
/* Shared snapshot storage. The primary key remains readable by older builds. */
const SaveManager = (() => {
  const version = 1;
  function decode(raw, valid) {
    try {
      const data = JSON.parse(raw);
      if (!data || (data.saveVersion != null && data.saveVersion !== version) || !valid(data)) return null;
      return data;
    } catch {
      return null;
    }
  }

  function load(storage, key, valid) {
    try {
      return decode(storage.getItem(key), valid) || decode(storage.getItem(key + ':backup'), valid);
    } catch {
      return null;
    }
  }

  function save(storage, key, data, valid) {
    try {
      const next = JSON.stringify({ ...data, saveVersion: version });
      if (!decode(next, valid)) return false;
      const previous = storage.getItem(key);
      if (previous === next) return true;
      if (decode(previous, valid)) storage.setItem(key + ':backup', previous);
      storage.setItem(key, next);
      return true;
    } catch {
      return false;
    }
  }

  return { load, save };
})();

// Deterministic NPC memory. Store the ledger with the game's save data.
const NPCMemory = (() => {
  const SHORT_LIMIT = 32;
  const LONG_LIMIT = 50;
  const WEIGHTS = { emotion: .35, relationship: .2, impact: .25, novelty: .1, goal: .1 };
  const ledgers = new WeakMap();
  const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
  const empty = () => ({ short: [], long: [], life: [] });

  function ledger(world) {
    return world.npcMemory ||= { version: 1, sequence: 0, events: {}, people: {} };
  }

  function index(data, person) {
    if (!ledgers.has(data)) ledgers.set(data, new Map());
    const people = ledgers.get(data);
    if (!people.has(person)) {
      const bySubject = new Map();
      const memory = Object.hasOwn(data.people, person) ? data.people[person] : empty();
      for (const entry of [...memory.short, ...memory.long]) {
        if (!bySubject.has(entry.subject)) bySubject.set(entry.subject, []);
        bySubject.get(entry.subject).push(entry);
      }
      people.set(person, bySubject);
    }
    return people.get(person);
  }

  function promote(memory, entry) {
    memory.long.push(entry);
    memory.long.sort((a, b) => b.importance - a.importance || b.sequence - a.sequence);
    memory.long.length = Math.min(LONG_LIMIT, memory.long.length);
    memory.life = memory.long.slice(0, 8).map(({ sources, interpretation }) => ({
      sources, interpretation
    }));
  }

  function remember(data, event, view) {
    const person = String(view.person);
    if (!Object.hasOwn(data.people, person)) {
      Object.defineProperty(data.people, person, { value: empty(), enumerable: true });
    }
    const memory = data.people[person];
    const subject = String(view.subject);
    const related = index(data, person).get(subject) || [];
    const confidence = clamp(view.confidence ?? 1, 0, 1);
    const signals = {
      emotion: Math.abs(view.emotion) * 100,
      relationship: view.relationship ?? 50,
      impact: view.impact ?? 50,
      novelty: related.some(entry => entry.type === event.type) ? 15 : 90,
      goal: view.goal ?? 50
    };
    const importance = Math.round(Object.entries(WEIGHTS).reduce(
      (total, [key, weight]) => total + clamp(signals[key], 0, 100) * weight, 0));
    if (importance < 25) return;
    const entry = {
      sources: [event.id], sequence: event.sequence, time: event.time,
      type: event.type, subject, interpretation: view.interpretation,
      emotion: view.emotion, confidence, importance, channel: view.channel || 'participant'
    };
    if (importance >= 72) {
      promote(memory, entry);
    } else {
      memory.short.push(entry);
      const similar = memory.short.filter(item =>
        item.subject === subject && item.type === event.type &&
        Math.sign(item.emotion) === Math.sign(entry.emotion));
      if (similar.length >= 3) {
        const merged = {
          ...entry, sources: similar.flatMap(item => item.sources),
          importance: Math.max(60, ...similar.map(item => item.importance)),
          emotion: similar.reduce((sum, item) => sum + item.emotion, 0) / similar.length,
          confidence: Math.min(...similar.map(item => item.confidence)),
          interpretation: entry.interpretation,
          occurrences: similar.length
        };
        memory.short = memory.short.filter(item => !similar.includes(item));
        promote(memory, merged);
      }
      while (memory.short.length > SHORT_LIMIT) {
        memory.short.sort((a, b) => a.importance - b.importance || a.sequence - b.sequence);
        const oldest = memory.short.shift();
        if (oldest.importance >= 62) promote(memory, oldest);
      }
    }
    ledgers.get(data).delete(person);
  }

  function record(world, facts, views) {
    const data = ledger(world);
    const sequence = facts.sequence ?? data.sequence + 1;
    // Events arrive in order. The watermark also rejects duplicates after compaction.
    if (sequence <= data.sequence) return null;
    if (sequence !== data.sequence + 1) throw new Error('NPC memory event sequence gap');
    const event = { ...facts, id: `event-${sequence}`, sequence };
    data.sequence = sequence;
    data.events[event.id] = event;
    const observers = new Set();
    for (const view of views) {
      const person = String(view.person);
      if (observers.has(person)) continue;
      observers.add(person);
      remember(data, event, view);
    }
    // Keep all retained memory sources and the most recent objective events.
    if (sequence % 64 === 0) {
      const retained = new Set(Object.values(data.people).flatMap(memory =>
        [...memory.short, ...memory.long].flatMap(entry => entry.sources)));
      for (const [id, source] of Object.entries(data.events)) {
        if (source.sequence <= sequence - 64 && !retained.has(id)) delete data.events[id];
      }
    }
    return event;
  }

  function influence(world, person, subject) {
    if (!world.npcMemory) return 0;
    const entries = index(world.npcMemory, String(person)).get(String(subject)) || [];
    return clamp(entries.reduce((total, entry) =>
      total + entry.emotion * entry.confidence * entry.importance / 100 *
        (entry.importance >= 60 ? 2 : 1), 0), -4, 4);
  }

  function recall(world, person) {
    const memory = world.npcMemory?.people[String(person)];
    return memory ? [...memory.short, ...memory.long].sort((a, b) => b.sequence - a.sequence) : [];
  }

  return { record, influence, recall };
})();

function makeGirl(o={}){

  let g1=pick(GIV),g2=pick(GIV); while(g2===g1) g2=pick(GIV);
  const sur=o.sur||pick(SUR.filter(x=>!S||x!==S.emp.sur));
  return {id:S.nid++, sur, given:o.given||(chance(.45)?g1:g1+g2), age:o.age||ri(16,19), trait, fam,
    looks:clamp(ri(40,88)+(T.looks||0)), talent:clamp(ri(30,85)+(T.talent||0)), virtue:clamp(ri(30,85)+(T.virtue||0)), scheme:clamp(ri(15,75)+(T.scheme||0)),
    rank:0, palace:'', favor:ri(5,15), mood:65, aff:ri(10,25), preg:0, prot:false, lastBirth:-99, alive:true, cold:false, gone:false,
    seed:ri(1,2e9), title:'', story:[], nights:0, known:false};
}
function assignPalace(c){
  if(c.rank===8){c.palace='坤宁宫';return}
  const cnt={};PALACES.forEach(p=>cnt[p]=0);harem().forEach(x=>{if(cnt[x.palace]!==undefined)cnt[x.palace]++});
  const min=Math.min(...Object.values(cnt));c.palace=pick(PALACES.filter(p=>cnt[p]===min));
}
function addConsort(c,rank,why){
  c.rank=rank; c.enteredAt=S.turn; S.consorts.push(c); assignPalace(c); S.ys.c++; initRel(c); assignArc(c); deepen(c); clanKey(c); if(c.kin)for(const id in c.kin){const o=byId(+id);if(o&&o.alive)relAdd(c,o,(isRival(c,o)?-30:45)-relGet(c,o))}
  story(c,`${why}，封为${RANKS[rank]}，赐居${c.palace}。`);
  log(`${fullName(c)}（${c.fam.t}之女）${why}，封${RANKS[rank]}。`);
}

function fmt(t){return String(t).split('\n').map(l=>l.startsWith('§')?`<p class="fx">${esc(l.slice(1))}</p>`:l?`<p>${esc(l)}</p>`:'').join('')}
function pushEv(ev){
  if(!ev)return;
  if(ev.maidEncounter){
    if(!maidEncounterReady())return;
    S.flags.lastMaidEncounter=S.turn;
  }
  Q.push(ev);if(!modalOpen)nextEv();
}
function pushNow(ev){if(!ev)return;Q.unshift(ev);if(!modalOpen)nextEv()}
function nextEv(){
  if(Q.length){openModal(Q.shift());return}
  modalOpen=false;curEv=null;$('#modal').hidden=true;checkEnd();render();
}
function openModal(ev){
  modalOpen=true;curEv=ev;if(ev.onShow)ev.onShow();const b=$('#mbox');
  let h=`<div class="mtitle">${esc(ev.title)}</div><div class="mbody">`;
  if(ev.por) h+=`<div class="mpor">${porImg(ev.por,112)}<div>${esc(porName(ev.por))}</div></div>`;
  h+=`<div class="mtext">${fmt(ev.text)}${ev.ref?`<p class="ref">典出 · ${esc(ev.ref)}</p>`:''}${ev.input?`<input id="minput" class="inp" maxlength="${ev.input.max||4}" value="${esc(ev.input.def||'')}" aria-label="输入">`:''}</div></div><div class="mch">`;
  ev.choices.forEach((c,i)=>{
    const ok=!c.cond||c.cond();
    const style=ev.danger?(c.f?' danger':' quiet'):c.primary||ev.choices.length===1||(ev.input&&i===0)?' primary':'';
    h+=`<button class="btn${style}" ${ok?'':'disabled'} onclick="choose(${i})">${esc(c.t)}${!ok&&c.why?`<small>${esc(c.why)}</small>`:''}</button>`;
  });
  b.innerHTML=h+'</div>';$('#modal').hidden=false;b.scrollTop=0;
  if(ev.sfx) AU.sfx(ev.sfx); else AU.sfx('page');
  const inp=$('#minput'); if(inp) setTimeout(()=>inp.select(),30);
}
function choose(i){
  const c=curEv&&curEv.choices[i];if(!c)return;if(c.cond&&!c.cond())return;
  const val=curEv.input?(($('#minput').value||'').trim().slice(0,curEv.input.max||4)||curEv.input.def):undefined;

function showRes(res){
  if(typeof res==='string') res={text:res};
  const b=$('#mbox');
  b.innerHTML=`<div class="mtitle">${esc(res.title||curEv.title)}</div><div class="mbody">${res.por?`<div class="mpor">${porImg(res.por,96)}</div>`:''}<div class="mtext">${fmt(res.text)}</div></div><div class="mch"><button class="btn gold" onclick="nextEv()">继续</button></div>`;

function nearestH(y){return HY.reduce((a,b)=>Math.abs(b-y)<Math.abs(a-y)?b:a)}
function planPath(sx,sy,tx,ty){const pts=[];let x=sx,y=sy;
  if(!HY.includes(y)){const ny=(x===100&&(y<46||y>100))?(y<46?46:100):nearestH(y);pts.push([x,ny]);y=ny}
  if(!HY.includes(ty)){const ny=ty<46?46:100;if(y!==ny){const sv=Math.abs(x-44)<Math.abs(x-154)?44:154;pts.push([sv,y],[sv,ny]);y=ny}pts.push([100,y],[100,ty]);return pts}
  if(ty===y){pts.push([tx,ty]);return pts}
  const vx=[44,154].sort((a,b)=>(Math.abs(x-a)+Math.abs(a-tx))-(Math.abs(x-b)+Math.abs(b-tx)))[0];
  pts.push([vx,y],[vx,ty],[tx,ty]);return pts}
function stepTo(n,sp){const [tx,ty]=n.path[0],dx=tx-n.x,dy=ty-n.y,d=Math.hypot(dx,dy);if(d<=sp){n.x=tx;n.y=ty;n.path.shift();return !n.path.length}n.x+=dx/d*sp;n.y+=dy/d*sp;return false}
function npcHome(c){const pl=PLACES.find(p=>p.k==='palace'&&p.p===c.palace);return pl?pl.d:[100,64]}
function npcSync(){const ids=new Set();alive().filter(c=>!c.maid).forEach(c=>{ids.add(c.id);if(!NPC.has(c.id)){const h=c.cold?[23,46]:npcHome(c);NPC.set(c.id,{x:h[0],y:h[1],path:[],wait:ri(5,60),ox:ri(-3,3),where:'home'})}});[...NPC.keys()].forEach(id=>{if(!ids.has(id))NPC.delete(id)})}
function npcStep(){npcSync();for(const [id,n] of NPC){const c=byId(id);if(!c)continue;
  if(c.cold){n.x=23;n.y=46;n.path=[];n.where='cold';continue}
  if(n.path.length){stepTo(n,1.2);continue}
  if(n.wait>0){n.wait--;continue}
  const home=npcHome(c),r=R();let dest,where;
  if(c.preg>=2||r<.45){dest=home;where='home'}else if(r<.75){dest=[100,46];where='garden'}
  else if(r<.88){const al=harem().filter(o=>o!==c&&relGet(c,o)>=30);dest=al.length?npcHome(pick(al)):home;where=al.length?'visit':'home'}else{dest=[100,64];where='kn'}
  n.path=planPath(Math.round(n.x),Math.round(n.y),dest[0],dest[1]);if(where==='garden')n.path.push([ri(64,136),ri(16,38)]);
  n.where=where;n.wait=ri(60,220)}}

    else{const cold=p.id==='lg',roof=cold?['#7d7d84','#5c5c63','#47474d']:p.id==='wy'?GROOF:YROOF;
      M(x,y,w,h,s===3?'#d8d1c6':'#d8c6a7');M(x,y+h-1,w,1,cold?'#8d8983':'#ac7967');
      const rx=x+3,ry=y+2,rw=w-6,rh=Math.max(4,h-5);M(rx,ry,rw,rh,roof[0]);for(let i=rx+1;i<rx+rw;i+=2)M(i,ry,1,rh,roof[1]);M(rx,ry+(rh>>1),rw,1,roof[2]);M(rx,ry+rh-1,rw,1,roof[1]);

      if(s===3)M(rx,ry,rw,rh>>1,'#f2f5f8');
      const top=p.d[1]<y;M(p.d[0]-2,top?y:y+h-1,4,1,'#3a2a20');
      if(p.k==='palace'&&p.p!=='冷宫'&&harem().some(c=>c.palace===p.p&&c.preg>=2)){M(x+w-4,y+1,2,2,'#f08aa8')}

    if(hoverP===p){mg.strokeStyle='#ffd86b';mg.lineWidth=1;mg.strokeRect(x-.5,y-.5,w+1,h+1)}});
  // 妃嫔
  for(const [id,n] of NPC){const c=byId(id);if(!c)continue;const x=Math.round(n.x+n.ox),y=Math.round(n.y);

    M(x-1,y-6,3,2,'#1d1520');M(x-1,y-4,3,1,'#f2cfb2');M(x-1,y-3,3,3,c.cold?'#8a8a8a':robeOf(c));M(x-1,y,1,1,INK);M(x+1,y,1,1,INK);
    if(c.preg>=2)M(x,y-8,1,1,'#f08aa8');if(c.rank>=5)M(x+1,y-7,1,1,GOLD)}
  // 皇帝与太监
  const tr=emp.trail[0]||[emp.x,emp.y];const ax=Math.round(tr[0])-4,ay=Math.round(tr[1]);
  M(ax-1,ay-5,3,1,'#33363c');M(ax-1,ay-4,3,1,'#f2cfb2');M(ax-1,ay-3,3,3,'#5b6b85');M(ax-2,ay-8,5,1,'#c0392b');M(ax,ay-7,1,3,'#5a3a22');

  if(best){const c=byId(best[0]),n=best[1];if(!c)return;n.path=[];n.wait=400;let tx=Math.round(n.x),ty=Math.round(n.y);
    if(!HY.includes(ty)){if(ty<46){tx=100;ty=46}else ty=nearestH(ty)}

  if(!c.woundKnown&&chance(.5))return {title:'母女夜话',por:m,text:`你路过${c.palace}，听见${v.name}在屋里低声叮嘱女儿：“……娘知道你心里苦。可这宫里不比家里，凡事要忍。”\n后来你才知道，${cName(c)}${WOUNDS[c.wound].replace(/^。/,'')}`,choices:[
    {t:'进去坐坐',f:()=>{c.woundKnown=true;remember(c,'care','母亲在宫时陛下来坐');story(c,'母亲在宫时，陛下进来坐了坐，第一次听她说起从前的事。');return fx(cchg(c,{aff:8,mood:8}))}},
    {t:'悄悄走开',f:()=>{c.woundKnown=true;return '你没有进去。'}}]};
  return {title:'谢恩',por:m,text:`${v.name}求见陛下，跪下谢恩：“小女自幼${pick(['娇惯','体弱','心思重','性子倔'])}，在宫里承蒙陛下照拂，民妇感激不尽。”`,choices:[
    {t:'赐座，闲话家常',f:()=>{story(c,`母亲${v.name}在宫中时，陛下赐座与她说了许久的话。`);return fx(cchg(c,{aff:6,mood:10}))}},
    {t:'赏她一柄玉如意（国库-5万两）',f:()=>fx(chg({treasury:-5}),cchg(c,{aff:4,mood:6}))},
    {t:'“夫人不必多礼。”',f:()=>fx(cchg(c,{mood:3}))}]}}
function visitorLine(c){const v=c.visitor;if(!v)return '';const left=v.until-S.turn;
  return `<div class="row" style="gap:10px;align-items:center;margin-top:6px;background:#fff3cf;border:2px solid var(--gold2);padding:6px 10px">${porImg(momObj(c),44)}<div class="grow">母亲 <b>${esc(v.name)}</b>（${esc(v.full)}）正在${esc(c.palace)}小住，${left>0?`还有 ${left} 个月出宫`:'本月出宫'}。<div class="hint">母亲在宫的日子，她每月心情都会好一些。</div></div></div>`}
A.momIn=function(id){const c=byId(id);if(c.visitor)return;if(E().treasury<15){toast('国库不足');return}chg({treasury:-15});momVisit(c,ri(2,3));setXin(c,'欢喜','母亲进宫来了');AU.sfx('joy');
